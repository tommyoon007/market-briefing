<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Market Briefing</title>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --bg: #0b1020;
      --panel: #151d31;
      --panel2: #1c2740;
      --line: #2b3854;
      --text: #edf2ff;
      --muted: #9eabc4;
      --accent: #75a7ff;
      --good: #55d69a;
      --bad: #ff7185;
      --my-stock: #f59e0b;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, sans-serif;
    }

    .container {
      max-width: 760px;
      margin: auto;
      padding: 14px;
    }

    .header {
      background: linear-gradient(135deg, #18233b, #10182b);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 22px;
      margin-bottom: 14px;
    }

    h1 {
      margin: 0 0 7px;
      font-size: 25px;
    }

    .date {
      color: var(--muted);
      font-size: 13px;
    }

    .section {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 14px;
    }

    h2 {
      font-size: 18px;
      margin: 0 0 12px;
    }

    .news {
      padding: 12px 0;
      border-bottom: 1px solid var(--line);
    }

    .news:last-child {
      border: 0;
      padding-bottom: 0;
    }

    .tag {
      display: inline-block;
      color: var(--accent);
      background: #1d3155;
      border-radius: 5px;
      padding: 4px 8px;
      font-size: 11px;
      margin-bottom: 7px;
      margin-right: 4px;
    }

    .tag-my {
      background: #3b2d11;
      color: var(--my-stock);
      border: 1px solid #78520d;
      font-weight: bold;
    }

    .news-title {
      font-weight: 700;
      margin-bottom: 5px;
    }

    .news-title a {
      color: var(--text);
      text-decoration: none;
    }

    .news-title a:hover {
      text-decoration: underline;
    }

    .news-text {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.55;
    }

    .toolbar {
      display: flex;
      gap: 8px;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .toolbar h2 {
      margin: 0;
    }

    .button {
      border: 1px solid var(--line);
      background: var(--panel2);
      color: var(--text);
      border-radius: 8px;
      padding: 8px 11px;
      font-size: 12px;
      cursor: pointer;
    }

    .button.primary {
      background: #315d9e;
      border-color: #4779c2;
    }

    .button:hover {
      filter: brightness(1.15);
    }

    .portfolio {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 7px;
    }

    .stock {
      background: var(--panel2);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 9px 4px;
      text-align: center;
      font-weight: 700;
      font-size: 12px;
    }

    .editor {
      display: none;
      margin-top: 10px;
    }

    .editor.open {
      display: block;
    }

    .hint {
      font-size: 12px;
      color: var(--muted);
      line-height: 1.5;
    }

    .input {
      width: 100%;
      min-height: 110px;
      background: #0e1628;
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px;
      font: 13px monospace;
      resize: vertical;
      margin-top: 8px;
    }

    .editor-buttons {
      margin-top: 8px;
      display: flex;
      gap: 8px;
    }

    .status {
      font-size: 12px;
      color: var(--good);
      margin-top: 8px;
    }

    .footer {
      text-align: center;
      color: var(--muted);
      font-size: 11px;
      padding: 6px;
    }

    @media (max-width: 430px) {
      .container {
        padding: 10px;
      }

      .portfolio {
        grid-template-columns: repeat(4, 1fr);
      }

      .section {
        padding: 13px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <header class="header">
      <h1>Market Briefing</h1>
      <div class="date">미국 자본시장 · 내 포트폴리오 브리핑</div>
    </header>

    <section class="section">
      <h2>미국 자본시장 뉴스</h2>
      <div id="newsContainer">
        <div class="news-text">뉴스를 불러오는 중입니다...</div>
      </div>
    </section>

    <section class="section">

      <div class="toolbar">
        <h2>내 보유 종목</h2>
        <button class="button primary" id="editBtn">종목 수정</button>
      </div>

      <div class="portfolio" id="portfolio"></div>

      <div class="editor" id="editor">

        <div class="hint">
          티커를 쉼표로 구분해 입력하세요.
          저장하면 내 종목 관련 뉴스를 우선적으로 상단에 보여줍니다.
        </div>

        <textarea
          class="input"
          id="tickerInput"
          placeholder="AAPL, MSFT, NVDA"
        ></textarea>

        <div class="editor-buttons">
          <button class="button primary" id="saveBtn">저장</button>
          <button class="button" id="cancelBtn">취소</button>
        </div>

        <div class="status" id="status"></div>

      </div>

    </section>

    <div class="footer">
      Market Briefing · 자동 뉴스 분석 앱
    </div>

  </div>

  <script>
    const defaultTickers = [
      "AAPL", "MSFT", "SMH", "GOOGL", "AMZN", "SOXX", "META", "MSTR",
      "DIS", "MRK", "NVDA", "AVGO", "V", "MA", "INTC", "KO",
      "MORT", "BMNR", "MP", "AMSC", "GFUZ", "DKNG", "AMADA", "PLTR",
      "MCD", "NFLX", "DJT", "CEG", "USD", "KRW"
    ];

    const key = "marketBriefingTickers";
    let tickers = [];
    let allArticles = [];

    const portfolio = document.getElementById("portfolio");
    const editor = document.getElementById("editor");
    const input = document.getElementById("tickerInput");
    const status = document.getElementById("status");
    const newsContainer = document.getElementById("newsContainer");

    function escapeHtml(str) {
      if (!str) return "";
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function load() {
      try {
        const stored = localStorage.getItem(key);
        tickers = stored ? JSON.parse(stored) : defaultTickers;
      } catch (e) {
        tickers = defaultTickers;
      }

      renderPortfolio();
      fetchNews();
    }

    function renderPortfolio() {
      portfolio.innerHTML = "";
      tickers.forEach(ticker => {
        const el = document.createElement("div");
        el.className = "stock";
        el.textContent = ticker;
        portfolio.appendChild(el);
      });
    }

    async function fetchNews() {
      try {
        const res = await fetch(`news.json?t=${Date.now()}`);
        if (!res.ok) throw new Error("news.json을 읽어올 수 없습니다.");
        
        const data = await res.json();
        allArticles = Array.isArray(data.articles) ? data.articles : [];
        renderNews();
      } catch (err) {
        console.error(err);
        newsContainer.innerHTML = `
          <div class="news-text">
            뉴스를 불러올 수 없습니다.<br>
            GitHub Actions 수집 작업이 실행된 후 news.json이 생성되면 자동으로 표시됩니다.
          </div>
        `;
      }
    }

    function renderNews() {
      if (!allArticles || allArticles.length === 0) {
        newsContainer.innerHTML = `<div class="news-text">수집된 뉴스가 없습니다.</div>`;
        return;
      }

      // 뉴스별 보유 종목 포함 여증 및 적합 엔티티 추출 분석
      const processedArticles = allArticles.map(art => {
        const entities = Array.isArray(art.entities) ? art.entities : [];
        
        // 내 보유 종목과 일치하는 엔티티 우선 탐색
        const matchedEntity = entities.find(e => 
          e && e.symbol && tickers.includes(e.symbol.toUpperCase())
        );

        const targetEntity = matchedEntity || entities[0] || null;
        const isMyStock = !!matchedEntity;

        return {
          raw: art,
          isMyStock: isMyStock,
          targetEntity: targetEntity
        };
      });

      // 내 보유 종목 뉴스를 상단으로 정렬
      processedArticles.sort((a, b) => (b.isMyStock ? 1 : 0) - (a.isMyStock ? 1 : 0));

      newsContainer.innerHTML = processedArticles.map(item => {
        const art = item.raw;
        const entity = item.targetEntity;
        const symbol = entity && entity.symbol ? entity.symbol.toUpperCase() : "";
        const score = entity && typeof entity.sentiment_score === "number" ? entity.sentiment_score : 0;

        let sentimentText = "중립";
        let tagStyle = "background: #1d3155; color: #75a7ff;";

        if (score > 0.05) {
          sentimentText = "호재 ▲";
          tagStyle = "background: #164e32; color: #55d69a;";
        } else if (score < -0.05) {
          sentimentText = "악재 ▼";
          tagStyle = "background: #541c24; color: #ff7185;";
        }

        const title = escapeHtml(art.title || "제목 없음");
        const snippet = escapeHtml(art.snippet || art.description || "상세 내용이 없습니다.");
        const url = art.url ? escapeHtml(art.url) : "#";
        const source = escapeHtml(art.source || "MarketAux");

        return `
          <div class="news">
            <div>
              ${item.isMyStock ? `<span class="tag tag-my">★ 내 종목</span>` : ""}
              <span class="tag" style="${tagStyle}">${sentimentText}</span>
              ${symbol ? `<span class="tag" style="background:#2b3854; color:#fff;">${symbol}</span>` : ""}
              <span class="tag" style="background:transparent; color:var(--muted); padding:0 4px;">${source}</span>
            </div>
            <div class="news-title">
              <a href="${url}" target="_blank" rel="noopener noreferrer">${title}</a>
            </div>
            <div class="news-text">${snippet}</div>
          </div>
        `;
      }).join("");
    }

    document.getElementById("editBtn").onclick = () => {
      input.value = tickers.join(", ");
      editor.classList.add("open");
      status.textContent = "";
    };

    document.getElementById("cancelBtn").onclick = () => {
      editor.classList.remove("open");
    };

    document.getElementById("saveBtn").onclick = () => {
      const next = input.value
        .split(",")
        .map(x => x.trim().toUpperCase())
        .filter(Boolean);

      if (!next.length) {
        status.style.color = "var(--bad)";
        status.textContent = "최소 1개 이상의 종목을 입력하세요.";
        return;
      }

      tickers = [...new Set(next)];
      localStorage.setItem(key, JSON.stringify(tickers));

      renderPortfolio();
      renderNews();

      status.style.color = "var(--good)";
      status.textContent = "저장했습니다.";
    };

    load();
  </script>

</body>
</html>
