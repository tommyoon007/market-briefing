<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Market Briefing</title>

  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0b1020">
  <link rel="icon" href="icon.svg" type="image/svg+xml">

  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #0b1020;
      color: #edf2ff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .container {
      max-width: 720px;
      margin: auto;
      padding: 16px;
    }
    .header {
      background: #151d31;
      border: 1px solid #2b3854;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    h1 { margin: 0; font-size: 20px; }
    .date { color: #9eabc4; font-size: 12px; margin-top: 4px; }
    .btn {
      background: #315d9e;
      color: #fff;
      border: none;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
    }
    .btn:hover { background: #4779c2; }
    .section {
      background: #151d31;
      border: 1px solid #2b3854;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
    }
    h2 { font-size: 15px; margin: 0 0 12px 0; color: #75a7ff; }
    .news-item {
      padding: 10px 0;
      border-bottom: 1px solid #2b3854;
    }
    .news-item:last-child { border-bottom: none; }
    .news-title { font-size: 14px; font-weight: bold; margin-bottom: 4px; line-height: 1.4; }
    .news-title a { color: #edf2ff; text-decoration: none; }
    .news-title a:hover { text-decoration: underline; }
    .news-meta { font-size: 11px; color: #9eabc4; display: flex; gap: 8px; align-items: center; }
    .badge {
      background: #3b2d11;
      color: #f59e0b;
      border: 1px solid #78520d;
      padding: 2px 5px;
      border-radius: 4px;
      font-weight: bold;
    }
    .portfolio-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
    }
    .tag {
      background: #1c2740;
      border: 1px solid #2b3854;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 11px;
    }
    .edit-box {
      display: flex;
      gap: 6px;
      margin-bottom: 10px;
    }
    .input-text {
      flex: 1;
      background: #0e1628;
      border: 1px solid #2b3854;
      color: #fff;
      padding: 6px;
      border-radius: 4px;
      font-size: 12px;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <div>
        <h1>Market Briefing</h1>
        <div class="date" id="lastUpdated">최신 시장 뉴스 확인 중...</div>
      </div>
      <button class="btn" id="refreshBtn">⚡ 새로고침</button>
    </div>

    <div class="section">
      <h2>🎯 내 관심/보유 종목 뉴스</h2>
      <div id="myNewsList">뉴스를 불러오는 중입니다...</div>
    </div>

    <div class="section">
      <h2>🌐 주요 시장 뉴스</h2>
      <div id="allNewsList">뉴스를 불러오는 중입니다...</div>
    </div>

    <div class="section">
      <h2>💼 내 종목 목록 설정</h2>
      <div class="edit-box">
        <input type="text" id="tickerInput" class="input-text" placeholder="티커 입력 (쉼표 구분: NVDA, TSLA, AAPL)">
        <button class="btn" id="saveTickersBtn">저장</button>
      </div>
      <div class="portfolio-tags" id="tickerTags"></div>
    </div>
  </div>

  <script>
    const defaultTickers = ["AAPL", "NVDA", "TSLA", "MSFT", "AMZN", "GOOGL", "META", "MSTR", "PLTR", "AMSC"];
    let myTickers = [];
    let allArticles = [];

    function loadTickers() {
      const saved = localStorage.getItem("myTickers");
      myTickers = saved ? JSON.parse(saved) : defaultTickers;
      document.getElementById("tickerInput").value = myTickers.join(", ");
      renderTickerTags();
    }

    function renderTickerTags() {
      const container = document.getElementById("tickerTags");
      container.innerHTML = myTickers.map(t => `<span class="tag">${t}</span>`).join("");
    }

    document.getElementById("saveTickersBtn").onclick = () => {
      const val = document.getElementById("tickerInput").value;
      myTickers = val.split(",").map(s => s.trim().toUpperCase()).filter(Boolean);
      localStorage.setItem("myTickers", JSON.stringify(myTickers));
      renderTickerTags();
      renderNews();
    };

    async function fetchNews() {
      const btn = document.getElementById("refreshBtn");
      btn.textContent = "🔄 로딩 중...";
      try {
        const res = await fetch(`news.json?t=${Date.now()}`);
        if (!res.ok) throw new Error("news.json 불러오기 실패");
        const data = await res.json();
        
        allArticles = data.articles || [];
        
        if (data.updated_at) {
          const d = new Date(data.updated_at);
          document.getElementById("lastUpdated").textContent = 
            `최종 업데이트: ${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
        }
        renderNews();
      } catch (e) {
        document.getElementById("myNewsList").innerHTML = "뉴스를 불러올 수 없습니다. 잠시 후 다시 시도해주세요.";
        document.getElementById("allNewsList").innerHTML = "뉴스를 불러올 수 없습니다.";
      } finally {
        btn.textContent = "⚡ 새로고침";
      }
    }

    function renderNews() {
      const myNewsContainer = document.getElementById("myNewsList");
      const allNewsContainer = document.getElementById("allNewsList");

      if (!allArticles.length) {
        myNewsContainer.innerHTML = "수집된 뉴스가 없습니다.";
        allNewsContainer.innerHTML = "수집된 뉴스가 없습니다.";
        return;
      }

      // 내 종목 뉴스 필터링 (제목에 내 티커명이 포함되어 있는지 검색)
      const myNews = allArticles.filter(art => {
        const titleUpper = art.title.toUpperCase();
        return myTickers.some(ticker => titleUpper.includes(ticker));
      });

      // 내 종목 뉴스 출력
      if (myNews.length === 0) {
        myNewsContainer.innerHTML = "<div style='color:#9eabc4; font-size:13px;'>설정하신 종목의 최신 기사가 없습니다.</div>";
      } else {
        myNewsContainer.innerHTML = myNews.map(art => renderNewsHtml(art, true)).join("");
      }

      // 전체 시장 뉴스 출력
      allNewsContainer.innerHTML = allArticles.map(art => renderNewsHtml(art, false)).join("");
    }

    function renderNewsHtml(art, isMy) {
      return `
        <div class="news-item">
          <div class="news-title">
            <a href="${art.url}" target="_blank" rel="noopener noreferrer">${art.title}</a>
          </div>
          <div class="news-meta">
            ${isMy ? `<span class="badge">관심종목</span>` : ""}
            <span>${art.source}</span>
          </div>
        </div>
      `;
    }

    document.getElementById("refreshBtn").onclick = fetchNews;

    loadTickers();
    fetchNews();
  </script>
</body>
</html>
