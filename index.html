<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Market Briefing</title>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --bg: #0b1020;
      --panel: #151d31;
      --panel2: #1c2740;
      --line: #2b3854;
      --text: #edf2ff;
      --muted: #9eabc4;
      --accent: #75a7ff;
      --good: #55d69a;
      --bad: #ff7185;
      --my-stock: #f59e0b;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, sans-serif;
    }

    .container {
      max-width: 760px;
      margin: auto;
      padding: 14px;
    }

    .header {
      background: linear-gradient(135deg, #18233b, #10182b);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 22px;
      margin-bottom: 14px;
    }

    h1 {
      margin: 0 0 7px;
      font-size: 25px;
    }

    .date {
      color: var(--muted);
      font-size: 13px;
    }

    .section {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 14px;
    }

    h2 {
      font-size: 18px;
      margin: 0 0 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .news {
      padding: 12px 0;
      border-bottom: 1px solid var(--line);
    }

    .news:last-child {
      border: 0;
      padding-bottom: 0;
    }

    .tag {
      display: inline-block;
      color: var(--accent);
      background: #1d3155;
      border-radius: 5px;
      padding: 4px 8px;
      font-size: 11px;
      margin-bottom: 7px;
      margin-right: 4px;
    }

    .tag-my {
      background: #3b2d11;
      color: var(--my-stock);
      border: 1px solid #78520d;
      font-weight: bold;
    }

    .news-title {
      font-weight: 700;
      font-size: 15px;
      margin-bottom: 6px;
      line-height: 1.4;
    }

    .news-title a {
      color: var(--text);
      text-decoration: none;
    }

    .news-title a:hover {
      text-decoration: underline;
    }

    .news-text {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.55;
      background: rgba(0, 0, 0, 0.15);
      padding: 8px 10px;
      border-radius: 6px;
      border-left: 3px solid var(--accent);
    }

    .toolbar {
      display: flex;
      gap: 8px;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .toolbar h2 {
      margin: 0;
    }

    .button {
      border: 1px solid var(--line);
      background: var(--panel2);
      color: var(--text);
      border-radius: 8px;
      padding: 8px 11px;
      font-size: 12px;
      cursor: pointer;
    }

    .button.primary {
      background: #315d9e;
      border-color: #4779c2;
    }

    .button:hover {
      filter: brightness(1.15);
    }

    .portfolio {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 7px;
    }

    .stock {
      background: var(--panel2);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 9px 4px;
      text-align: center;
      font-weight: 700;
      font-size: 12px;
    }

    .editor {
      display: none;
      margin-top: 10px;
    }

    .editor.open {
      display: block;
    }

    .hint {
      font-size: 12px;
      color: var(--muted);
      line-height: 1.5;
    }

    .input {
      width: 100%;
      min-height: 110px;
      background: #0e1628;
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px;
      font: 13px monospace;
      resize: vertical;
      margin-top: 8px;
    }

    .editor-buttons {
      margin-top: 8px;
      display: flex;
      gap: 8px;
    }

    .status {
      font-size: 12px;
      color: var(--good);
      margin-top: 8px;
    }

    .footer {
      text-align: center;
      color: var(--muted);
      font-size: 11px;
      padding: 6px;
    }

    @media (max-width: 430px) {
      .container {
        padding: 10px;
      }

      .portfolio {
        grid-template-columns: repeat(4, 1fr);
      }

      .section {
        padding: 13px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <header class="header">
      <h1>Market Briefing</h1>
      <div class="date" id="lastUpdated">미국 자본시장 · 한글 뉴스 자동 요약 브리핑</div>
    </header>

    <!-- 1. 전체 시장 요약 뉴스 창 -->
    <section class="section">
      <h2>🌐 전체 시장 요약 브리핑</h2>
      <div id="marketNewsContainer">
        <div class="news-text">전체 시장 뉴스를 불러오는 중입니다...</div>
      </div>
    </section>

    <!-- 2. 내 보유 종목 뉴스 창 -->
    <section class="section">
      <h2>🎯 내 보유 종목 뉴스</h2>
      <div id="portfolioNewsContainer">
        <div class="news-text">보유 종목 뉴스를 불러오는 중입니다...</div>
      </div>
    </section>

    <!-- 3. 내 보유 종목 관리 창 -->
    <section class="section">

      <div class="toolbar">
        <h2>💼 내 보유 종목</h2>
        <button class="button primary" id="editBtn">종목 수정</button>
      </div>

      <div class="portfolio" id="portfolio"></div>

      <div class="editor" id="editor">

        <div class="hint">
          티커를 쉼표로 구분해 입력하세요.
          저장하면 내 종목 뉴스 목록이 최신 설정에 맞게 필터링됩니다.
        </div>

        <textarea
          class="input"
          id="tickerInput"
          placeholder="AAPL, MSFT, NVDA"
        ></textarea>

        <div class="editor-buttons">
          <button class="button primary" id="saveBtn">저장</button>
          <button class="button" id="cancelBtn">취소</button>
        </div>

        <div class="status" id="status"></div>

      </div>

    </section>

    <div class="footer">
      Market Briefing · 자동 뉴스 번역 및 요약 앱
    </div>

  </div>

  <script>
    const defaultTickers = [
      "AAPL", "MSFT", "SMH", "GOOGL", "AMZN", "SOXX", "META", "MSTR",
      "DIS", "MRK", "NVDA", "AVGO", "V", "MA", "INTC", "KO",
      "MORT", "BMNR", "MP", "AMSC", "GFUZ", "DKNG", "AMADA", "PLTR",
      "MCD", "NFLX", "DJT", "CEG", "USD", "KRW"
    ];

    const key = "marketBriefingTickers";
    let tickers = [];
    let newsData = { updated_at: "", market_news: [], portfolio_news: [] };

    const portfolio = document.getElementById("portfolio");
    const editor = document.getElementById("editor");
    const input = document.getElementById("tickerInput");
    const status = document.getElementById("status");
    const marketNewsContainer = document.getElementById("marketNewsContainer");
    const portfolioNewsContainer = document.getElementById("portfolioNewsContainer");
    const lastUpdatedEl = document.getElementById("lastUpdated");

    function escapeHtml(str) {
      if (!str) return "";
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function load() {
      try {
        const stored = localStorage.getItem(key);
        tickers = stored ? JSON.parse(stored) : defaultTickers;
      } catch (e) {
        tickers = defaultTickers;
      }

      renderPortfolio();
      fetchNews();
    }

    function renderPortfolio() {
      portfolio.innerHTML = "";
      tickers.forEach(ticker => {
        const el = document.createElement("div");
        el.className = "stock";
        el.textContent = ticker;
        portfolio.appendChild(el);
      });
    }

    async function fetchNews() {
      try {
        const res = await fetch(`news.json?t=${Date.now()}`);
        if (!res.ok) throw new Error("news.json 파일이 존재하지 않습니다.");
        
        newsData = await res.json();
        
        if (newsData.updated_at) {
          const dateObj = new Date(newsData.updated_at);
          lastUpdatedEl.textContent = `마지막 업데이트: ${dateObj.toLocaleString("ko-KR")}`;
        }
        
        renderAllNews();
      } catch (err) {
        console.error(err);
        const errHtml = `
          <div class="news-text">
            뉴스를 불러올 수 없습니다.<br>
            GitHub Actions 자동 수집 및 번역 작업이 실행된 후 표시됩니다.
          </div>
        `;
        marketNewsContainer.innerHTML = errHtml;
        portfolioNewsContainer.innerHTML = errHtml;
      }
    }

    function renderNewsList(articles, container, isPortfolioSection = false) {
      if (!articles || articles.length === 0) {
        container.innerHTML = `<div class="news-text">수집된 뉴스가 없습니다.</div>`;
        return;
      }

      let displayList = articles;

      // 보유 종목 구역일 경우 현재 저장된 보유 종목(tickers) 기준으로 필터링
      if (isPortfolioSection) {
        displayList = articles.filter(art => {
          const sym = art.symbol ? art.symbol.toUpperCase() : "";
          return tickers.includes(sym);
        });

        if (displayList.length === 0) {
          container.innerHTML = `<div class="news-text">현재 설정된 내 보유 종목에 해당하는 최근 뉴스가 없습니다.</div>`;
          return;
        }
      }

      container.innerHTML = displayList.map(art => {
        const symbol = art.symbol ? art.symbol.toUpperCase() : "";
        const score = typeof art.sentiment_score === "number" ? art.sentiment_score : 0;

        let sentimentText = "중립";
        let tagStyle = "background: #1d3155; color: #75a7ff;";

        if (score > 0.05) {
          sentimentText = "호재 ▲";
          tagStyle = "background: #164e32; color: #55d69a;";
        } else if (score < -0.05) {
          sentimentText = "악재 ▼";
          tagStyle = "background: #541c24; color: #ff7185;";
        }

        const titleKo = escapeHtml(art.title_ko || art.title || "제목 없음");
        const snippetKo = escapeHtml(art.snippet_ko || art.snippet || "상세 요약이 없습니다.");
        const url = art.url ? escapeHtml(art.url) : "#";
        const source = escapeHtml(art.source || "MarketAux");
        const isMy = symbol && tickers.includes(symbol);

        return `
          <div class="news">
            <div>
              ${isMy ? `<span class="tag tag-my">★ 내 종목</span>` : ""}
              <span class="tag" style="${tagStyle}">${sentimentText}</span>
              ${symbol ? `<span class="tag" style="background:#2b3854; color:#fff;">${symbol}</span>` : ""}
              <span class="tag" style="background:transparent; color:var(--muted); padding:0 4px;">${source}</span>
            </div>
            <div class="news-title">
              <a href="${url}" target="_blank" rel="noopener noreferrer">${titleKo}</a>
            </div>
            <div class="news-text">💡 ${snippetKo}</div>
          </div>
        `;
      }).join("");
    }

    function renderAllNews() {
      renderNewsList(newsData.market_news || [], marketNewsContainer, false);
      renderNewsList(newsData.portfolio_news || [], portfolioNewsContainer, true);
    }

    document.getElementById("editBtn").onclick = () => {
      input.value = tickers.join(", ");
      editor.classList.add("open");
      status.textContent = "";
    };

    document.getElementById("cancelBtn").onclick = () => {
      editor.classList.remove("open");
    };

    document.getElementById("saveBtn").onclick = () => {
      const next = input.value
        .split(",")
        .map(x => x.trim().toUpperCase())
        .filter(Boolean);

      if (!next.length) {
        status.style.color = "var(--bad)";
        status.textContent = "최소 1개 이상의 종목을 입력하세요.";
        return;
      }

      tickers = [...new Set(next)];
      localStorage.setItem(key, JSON.stringify(tickers));

      renderPortfolio();
      renderAllNews();

      status.style.color = "var(--good)";
      status.textContent = "저장했습니다.";
    };

    load();
  </script>

</body>
</html>
