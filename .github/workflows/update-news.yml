name: Update Market News

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0,6,12,18 * * *"

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch MarketAux news
        env:
          MARKETAUX_API_TOKEN: ${{ secrets.MARKETAUX_API_TOKEN }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          from datetime import datetime, timedelta, timezone
          from urllib.error import HTTPError, URLError
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen

          API_KEY = os.environ.get("MARKETAUX_API_TOKEN")

          if not API_KEY:
              print("ERROR: MARKETAUX_API_TOKEN secret is missing.")
              sys.exit(1)

          API_URL = "https://api.marketaux.com/v1/news/all"

          portfolio_symbols = [
              "AAPL", "MSFT", "META", "GOOGL", "AMZN",
              "MSTR", "NVDA", "AVGO", "DIS", "MRK",
              "V", "MA", "NFLX", "TSLA", "PLTR",
              "DKNG", "MP", "AMSC", "INTC"
          ]

          # 미국 주식시장 관련성을 판단할 핵심 단어
          market_keywords = [
              "stock", "stocks", "stock market", "share",
              "shares", "equity", "equities", "nasdaq",
              "s&p", "dow", "wall street", "investor",
              "investors", "earnings", "revenue", "profit",
              "loss", "fed", "federal reserve", "interest rate",
              "inflation", "tariff", "trade", "treasury",
              "bond", "yield", "oil", "gold", "bitcoin",
              "crypto", "semiconductor", "technology",
              "artificial intelligence", "ai", "economy",
              "economic", "gdp", "jobs", "employment",
              "unemployment", "recession", "ipo", "merger"
          ]

          def fetch_marketaux(symbols=None):
              published_after = (
                  datetime.now(timezone.utc) - timedelta(hours=48)
              ).strftime("%Y-%m-%dT%H:%M:%S")

              params = {
                  "api_token": API_KEY,
                  "language": "en",
                  "limit": "50",
                  "published_after": published_after,
                  "filter_entities": "true"
              }

              if symbols:
                  params["symbols"] = ",".join(symbols)

              url = API_URL + "?" + urlencode(params)

              print("Requesting MarketAux...")
              print("Published after:", published_after)
              print("Symbols:", params.get("symbols", "none"))

              request = Request(
                  url,
                  headers={"User-Agent": "market-briefing/1.0"}
              )

              try:
                  with urlopen(request, timeout=30) as response:
                      return json.loads(
                          response.read().decode("utf-8")
                      )

              except HTTPError as error:
                  error_body = error.read().decode(
                      "utf-8", errors="replace"
                  )
                  print("MarketAux HTTP ERROR:", error.code)
                  print("MarketAux RESPONSE:", error_body)
                  raise

              except URLError as error:
                  print("MarketAux URL ERROR:", error.reason)
                  raise

          def get_symbol(article):
              for entity in article.get("entities") or []:
                  symbol = (entity.get("symbol") or "").upper()
                  if symbol:
                      return symbol
              return ""

          def make_item(article):
              return {
                  "title": article.get("title") or "",
                  "title_ko": article.get("title") or "",
                  "snippet": article.get("description") or "",
                  "snippet_ko": article.get("description") or "",
                  "symbol": get_symbol(article),
                  "sentiment_score": 0.0,
                  "source": (
                      article.get("source")
                      or article.get("source_name")
                      or ""
                  ),
                  "url": article.get("url") or "",
                  "cross_verified": False,
                  "published_at": article.get("published_at") or ""
              }

          def is_market_related(article):
              text = " ".join([
                  article.get("title") or "",
                  article.get("description") or ""
              ]).lower()

              return any(
                  keyword in text
                  for keyword in market_keywords
              )

          def unique_articles(articles):
              result = []
              seen = set()

              for article in articles:
                  url = article.get("url") or ""
                  title = article.get("title") or ""
                  unique_key = url or title

                  if not unique_key or unique_key in seen:
                      continue

                  seen.add(unique_key)
                  result.append(article)

              return result

          # 보유 종목 뉴스
          print("MarketAux: portfolio news")

          portfolio_data = fetch_marketaux(portfolio_symbols)
          portfolio_articles = portfolio_data.get("data") or []

          portfolio_news = [
              make_item(article)
              for article in unique_articles(portfolio_articles)
              if get_symbol(article) in portfolio_symbols
          ]

          # 시장 전체 뉴스
          print("MarketAux: market news")

          market_data = fetch_marketaux()
          market_articles = market_data.get("data") or []

          market_news = [
              make_item(article)
              for article in unique_articles(market_articles)
              if is_market_related(article)
          ]

          output = {
              "updated_at": datetime.now(timezone.utc).isoformat(),
              "status": "ok",
              "market_news": market_news,
              "portfolio_news": portfolio_news
          }

          with open("news.json", "w", encoding="utf-8") as file:
              json.dump(output, file, ensure_ascii=False, indent=2)

          print("SUCCESS")
          print("Market news:", len(market_news))
          print("Portfolio news:", len(portfolio_news))
          print("news.json created")
          PY

      - name: Commit news.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add news.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update market news"
            git push
          fi
