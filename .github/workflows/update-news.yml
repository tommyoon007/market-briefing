name: Update Market News

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch English market news
        env:
          MARKETAUX_API_TOKEN: ${{ secrets.MARKETAUX_API_TOKEN }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request
          from datetime import datetime, timezone

          token = os.environ["MARKETAUX_API_TOKEN"]

          params = urllib.parse.urlencode({
              "api_token": token,
              "language": "en",
              "limit": 50,
              "must_have_entities": "true"
          })

          url = "https://api.marketaux.com/v1/news/all?" + params

          request = urllib.request.Request(
              url,
              headers={"User-Agent": "market-briefing/1.0"}
          )

          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  payload = json.loads(response.read().decode("utf-8"))

              articles = []

              for item in payload.get("data", []):
                  articles.append({
                      "title": item.get("title", ""),
                      "description": item.get("description", ""),
                      "url": item.get("url", ""),
                      "source": item.get("source", ""),
                      "published_at": item.get("published_at", ""),
                      "entities": [
                          entity.get("symbol", "")
                          for entity in item.get("entities", [])
                          if entity.get("symbol")
                      ]
                  })

              result = {
                  "updated_at": datetime.now(timezone.utc).isoformat(),
                  "status": "ok",
                  "articles": articles
              }

          except Exception as error:
              result = {
                  "updated_at": datetime.now(timezone.utc).isoformat(),
                  "status": "error",
                  "error": str(error),
                  "articles": []
              }

          with open("news.json", "w", encoding="utf-8") as file:
              json.dump(result, file, ensure_ascii=False, indent=2)
          PY

      - name: Commit updated news
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news.json
          git diff --cached --quiet || git commit -m "Update market news"
          git push
