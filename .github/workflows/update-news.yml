name: Update Market News

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Collect MarketAux news
        env:
          MARKETAUX_API_TOKEN: ${{ secrets.MARKETAUX_API_TOKEN }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request
          from datetime import datetime, timezone, timedelta

          TOKEN = os.environ.get("MARKETAUX_API_TOKEN", "").strip()

          if not TOKEN:
              raise RuntimeError("MARKETAUX_API_TOKEN secret not found.")

          PORTFOLIO_TICKERS = {
              "AAPL", "MSFT", "TSLA", "SMH", "GOOGL", "AMZN",
              "SOXX", "META", "MSTR", "DIS", "MRK", "NVDA",
              "AVGO", "V", "MA", "INTC", "KO", "MORT", "BMNR",
              "MP", "AMSC", "GFUZ", "DKNG", "AMADA", "PLTR",
              "MCD", "NFLX", "DJT", "CEG"
          }

          def fetch_marketaux(params):
              params["api_token"] = TOKEN

              url = (
                  "https://api.marketaux.com/v1/news/all?"
                  + urllib.parse.urlencode(params)
              )

              request = urllib.request.Request(
                  url,
                  headers={"User-Agent": "MarketBriefing/1.0"}
              )

              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.loads(
                      response.read().decode("utf-8")
                  )

          def clean_text(value):
              if not value:
                  return ""

              return " ".join(str(value).split()).strip()

          def convert_article(article):
              title = clean_text(article.get("title", ""))

              description = clean_text(
                  article.get("description", "")
                  or article.get("snippet", "")
              )

              url = str(article.get("url", "")).strip()

              source = str(
                  article.get("source", "")
                  or article.get("domain", "")
                  or "MarketAux"
              ).strip()

              published_at = str(
                  article.get("published_at", "")
              ).strip()

              symbol = ""

              sentiment_score = 0.0

              entities = article.get("entities", [])

              if isinstance(entities, list):
                  for entity in entities:
                      if not isinstance(entity, dict):
                          continue

                      entity_symbol = str(
                          entity.get("symbol", "")
                      ).upper().strip()

                      if entity_symbol in PORTFOLIO_TICKERS:
                          symbol = entity_symbol

                          try:
                              sentiment_score = float(
                                  entity.get(
                                      "sentiment_score",
                                      0
                                  ) or 0
                              )
                          except Exception:
                              sentiment_score = 0.0

                          break

              return {
                  "title": title,
                  "title_ko": "[번역 대기] " + title,
                  "snippet": description[:300],
                  "snippet_ko": "[번역 대기] " + description[:300],
                  "symbol": symbol,
                  "sentiment_score": sentiment_score,
                  "source": source,
                  "url": url,
                  "cross_verified": False,
                  "published_at": published_at
              }

          # 최근 48시간 기사만 수집
          published_after = (
              datetime.now(timezone.utc) - timedelta(hours=48)
          ).isoformat()

          all_articles = []

          print("MarketAux: portfolio news")

          portfolio_data = fetch_marketaux({
              "symbols": ",".join(sorted(PORTFOLIO_TICKERS)),
              "language": "en",
              "filter_entities": "true",
              "published_after": published_after,
              "limit": "50"
          })

          portfolio_raw = portfolio_data.get("data", [])

          if isinstance(portfolio_raw, list):
              all_articles.extend(portfolio_raw)

          print("MarketAux: market news")

          market_data = fetch_marketaux({
              "symbols": "SPY,QQQ,DIA",
              "language": "en",
              "filter_entities": "true",
              "published_after": published_after,
              "limit": "50"
          })

          market_raw = market_data.get("data", [])

          market_articles = (
              market_raw if isinstance(market_raw, list) else []
          )

          seen = set()

          portfolio_news = []
          market_news = []

          def article_key(article):
              uuid = str(article.get("uuid", "")).strip()

              if uuid:
                  return "uuid:" + uuid

              url = str(article.get("url", "")).strip()

              if url:
                  return "url:" + url

              return "title:" + clean_text(
                  article.get("title", "")
              ).lower()

          for article in all_articles:
              try:
                  key = article_key(article)

                  if key in seen:
                      continue

                  seen.add(key)

                  item = convert_article(article)

                  if item["symbol"] in PORTFOLIO_TICKERS:
                      if item["title"]:
                          portfolio_news.append(item)

              except Exception as error:
                  print("Portfolio article error:", error)

          for article in market_articles:
              try:
                  key = article_key(article)

                  if key in seen:
                      continue

                  seen.add(key)

                  item = convert_article(article)

                  if item["title"]:
                      market_news.append(item)

              except Exception as error:
                  print("Market article error:", error)

          def sort_key(article):
              return article.get("published_at", "")

          portfolio_news.sort(
              key=sort_key,
              reverse=True
          )

          market_news.sort(
              key=sort_key,
              reverse=True
          )

          portfolio_news = portfolio_news[:60]
          market_news = market_news[:60]

          # 기존 news.json과 병합하지 않고 새로 생성
          result = {
              "updated_at": datetime.now(timezone.utc).isoformat(),
              "status": "ok",
              "market_news": market_news,
              "portfolio_news": portfolio_news
          }

          with open("news.json", "w", encoding="utf-8") as file:
              json.dump(
                  result,
                  file,
                  ensure_ascii=False,
                  indent=2
              )

          print("Market news:", len(market_news))
          print("Portfolio news:", len(portfolio_news))
          print("news.json successfully created.")
          PY

      - name: Validate news.json
        run: |
          python - <<'PY'
          import json

          with open("news.json", "r", encoding="utf-8") as file:
              data = json.load(file)

          assert isinstance(data.get("market_news"), list)
          assert isinstance(data.get("portfolio_news"), list)
          assert data.get("status") == "ok"

          print("news.json validation: OK")
          PY

      - name: Save news.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add news.json

          if git diff --cached --quiet; then
            echo "No news.json changes."
          else
            git commit -m "Update market news"
            git push
          fi
