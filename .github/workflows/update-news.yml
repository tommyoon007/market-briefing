name: Update Market News

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create news.json
        env:
          MARKETAUX_API_TOKEN: ${{ secrets.MARKETAUX_API_TOKEN }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request
          from datetime import datetime, timezone

          token = os.environ.get("MARKETAUX_API_TOKEN", "")

          target_symbols = "AAPL,MSFT,NVDA,MSTR,PLTR,AMSC,GOOGL,AMZN,META,TSLA"

          params = urllib.parse.urlencode({
              "api_token": token,
              "language": "en",
              "symbols": target_symbols,
              "limit": 50
          })

          url = "https://api.marketaux.com/v1/news/all?" + params

          request = urllib.request.Request(
              url,
              headers={"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64)"}
          )

          new_articles = None

          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  if response.status == 200:
                      raw = response.read().decode("utf-8")
                      data = json.loads(raw)
                      new_articles = data.get("data", [])
          except Exception as e:
              print(f"API 호출 중 오류 발생: {e}")

          # API 실패 시 기존 news.json 파일이 있다면 보존
          if new_articles is None:
              if os.path.exists("news.json"):
                  print("API 호출 실패로 기존 news.json 파일 데이터를 유지합니다.")
                  try:
                      with open("news.json", "r", encoding="utf-8") as f:
                          existing_data = json.load(f)
                          new_articles = existing_data.get("articles", [])
                  except Exception as ex:
                      print(f"기존 파일 읽기 실패: {ex}")
                      new_articles = []
              else:
                  new_articles = []

          result = {
              "updated_at": datetime.now(timezone.utc).isoformat(),
              "status": "ok" if new_articles else "error",
              "articles": new_articles
          }

          with open("news.json", "w", encoding="utf-8") as f:
              json.dump(result, f, ensure_ascii=False, indent=2)
          PY

      - name: Save news.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news.json
          git diff --cached --quiet || git commit -m "Update market news"
          git push
