name: Update Market News

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"  # 매 1시간마다 실행 (1일 24회 × 4번 분할호출 = 96회 차감 / 100회 제한 통과)

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch News and Accumulate
        env:
          MARKETAUX_API_TOKEN: ${{ secrets.MARKETAUX_API_TOKEN }}
        run: |
          python - <<'PY'
          import json, os, time
          import urllib.parse, urllib.request, urllib.error
          from datetime import datetime, timezone

          token = os.environ.get("MARKETAUX_API_TOKEN", "")
          target_symbols = ["SPY","QQQ","DIA","AAPL","MSFT","NVDA","MSTR","PLTR","AMSC","GOOGL","AMZN","META","TSLA","SMH","SOXX"]
          
          # 일일 100회 한도에 맞추기 위해 4개씩 4그룹으로 쪼개기 (1시간마다 실행 시 총 96회 호출)
          chunks = [target_symbols[i:i + 4] for i in range(0, len(target_symbols), 4)]
          
          raw_articles = []
          for chunk in chunks:
              params = urllib.parse.urlencode({
                  "api_token": token,
                  "language": "en",
                  "symbols": ",".join(chunk),
                  "limit": 50
              })
              url = "https://api.marketaux.com/v1/news/all?" + params
              req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
              
              try:
                  with urllib.request.urlopen(req, timeout=25) as resp:
                      if resp.status == 200:
                          data = json.loads(resp.read().decode("utf-8")).get("data", [])
                          raw_articles.extend(data)
              except urllib.error.HTTPError as e:
                  print(f"API 오류 ({','.join(chunk)}): {e.code} - {e.read().decode('utf-8')}")
              except Exception as e:
                  print(f"네트워크 오류: {e}")
              
              time.sleep(1)

          seen_titles = {}
          processed_articles = []
          target_set = set(target_symbols)

          for item in raw_articles:
              title_en = item.get("title", "").strip()
              snippet_en = item.get("snippet") or item.get("description") or ""
              title_key = title_en.lower()[:30]

              symbol = ""
              sentiment_score = 0
              entities = item.get("entities", [])
              
              for ent in entities:
                  sym = ent.get("symbol", "").upper()
                  if sym in target_set:
                      symbol = sym
                      sentiment_score = ent.get("sentiment_score", 0)
                      break
              
              if not symbol and entities:
                  symbol = entities[0].get("symbol", "").upper()
                  sentiment_score = entities[0].get("sentiment_score", 0)

              article_obj = {
                  "title": title_en, "title_ko": title_en,
                  "snippet": snippet_en[:180] + "..." if len(snippet_en) > 180 else snippet_en,
                  "snippet_ko": snippet_en[:180] + "..." if len(snippet_en) > 180 else snippet_en,
                  "symbol": symbol, "sentiment_score": sentiment_score,
                  "source": item.get("source", "MarketAux"),
                  "url": item.get("url", "#"),
                  "cross_verified": False,
                  "published_at": item.get("published_at", "")
              }

              if title_key in seen_titles:
                  seen_titles[title_key]["cross_verified"] = True
              else:
                  seen_titles[title_key] = article_obj
                  processed_articles.append(article_obj)

          market_indices = {"SPY", "QQQ", "DIA", "IWM", "VT"}
          new_market_news, new_portfolio_news = [], []

          for art in processed_articles:
              if art["symbol"] in market_indices or not art["symbol"]:
                  new_market_news.append(art)
              else:
                  new_portfolio_news.append(art)

          old_data = {}
          if os.path.exists("news.json"):
              try:
                  with open("news.json", "r", encoding="utf-8") as f:
                      old_data = json.load(f)
              except Exception: pass

          def merge_articles(new_list, old_list, max_limit=200):
              seen_urls = {art.get("url") for art in new_list if art.get("url")}
              combined = list(new_list)
              for art in old_list:
                  url = art.get("url")
                  if url and url not in seen_urls:
                      combined.append(art)
                      seen_urls.add(url)
              return combined[:max_limit]

          market_news = merge_articles(new_market_news, old_data.get("market_news", []), 200)
          portfolio_news = merge_articles(new_portfolio_news, old_data.get("portfolio_news", []), 200)

          result = {
              "updated_at": datetime.now(timezone.utc).isoformat(),
              "status": "ok" if (market_news or portfolio_news) else "error",
              "market_news": market_news,
              "portfolio_news": portfolio_news
          }

          with open("news.json", "w", encoding="utf-8") as f:
              json.dump(result, f, ensure_ascii=False, indent=2)
          PY

      - name: Save news.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news.json
          git diff --cached --quiet || git commit -m "Update market news (1 hour interval, chunked by 4)"
          git push
