name: Update Market News

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"  # 10분마다 실행

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Fetch News and Create news.json
        run: |
          python - <<'PY'
          import json
          import re
          import html
          import urllib.request
          import xml.etree.ElementTree as ET
          from datetime import datetime, timezone

          def clean_text(raw_text):
              if not raw_text:
                  return ""
              # HTML 태그 제거 및 특수문자 디코딩
              text = re.sub(r'<[^>]+>', '', str(raw_text))
              return html.unescape(text).strip()

          def fetch_google_news(query):
              articles = []
              url = f"https://news.google.com/rss/search?q={urllib.parse.quote(query)}&hl=en-US&gl=US&ceid=US:en"
              
              req = urllib.request.Request(
                  url, 
                  headers={"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64)"}
              )
              
              try:
                  with urllib.request.urlopen(req, timeout=10) as resp:
                      xml_data = resp.read()
                      root = ET.fromstring(xml_data)
                      
                      for item in root.findall(".//item")[:30]:
                          title = clean_text(item.findtext("title"))
                          link = clean_text(item.findtext("link"))
                          pub_date = clean_text(item.findtext("pubDate"))
                          
                          # 출처 분리 (예: "Title - Source" 형태)
                          source = "Google News"
                          if " - " in title:
                              parts = title.rsplit(" - ", 1)
                              title = parts[0]
                              source = parts[1]

                          if title and link:
                              articles.append({
                                  "title": title,
                                  "url": link,
                                  "source": source,
                                  "published_at": pub_date
                              })
              except Exception as e:
                  print(f"Fetch Error ({query}): {e}")
              return articles

          # 주요 시장 뉴스 및 주요 종목 뉴스 수집
          market_articles = fetch_google_news("stock market OR economy when:1d")
          stock_articles = fetch_google_news("Nvidia OR Apple OR Tesla OR Microsoft OR Palantir OR MicroStrategy stock when:1d")

          # 중복 제거 (URL 기준)
          seen_urls = set()
          final_news = []
          for art in market_articles + stock_articles:
              if art["url"] not in seen_urls:
                  seen_urls.add(art["url"])
                  final_news.append(art)

          result = {
              "updated_at": datetime.now(timezone.utc).isoformat(),
              "articles": final_news[:50]
          }

          with open("news.json", "w", encoding="utf-8") as f:
              json.dump(result, f, ensure_ascii=False, indent=2)
          PY

      - name: Commit and Push Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto update news.json" && git push)
