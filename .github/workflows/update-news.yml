name: Update Market News

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create news.json with Deduplication and Accumulation
        env:
          MARKETAUX_API_TOKEN: ${{ secrets.MARKETAUX_API_TOKEN }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request
          from datetime import datetime, timezone

          token = os.environ.get("MARKETAUX_API_TOKEN", "")

          target_symbols = "SPY,QQQ,DIA,AAPL,MSFT,NVDA,MSTR,PLTR,AMSC,GOOGL,AMZN,META,TSLA,SMH,SOXX"

          params = urllib.parse.urlencode({
              "api_token": token,
              "language": "en",
              "symbols": target_symbols,
              "limit": 50
          })

          url = "https://api.marketaux.com/v1/news/all?" + params
          req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})

          raw_articles = []
          try:
              with urllib.request.urlopen(req, timeout=25) as resp:
                  if resp.status == 200:
                      raw_articles = json.loads(resp.read().decode("utf-8")).get("data", [])
          except Exception as e:
              print(f"API 호출 오류: {e}")

          seen_titles = {}
          processed_articles = []

          for item in raw_articles:
              title_en = item.get("title", "").strip()
              snippet_en = item.get("snippet") or item.get("description") or ""
              
              title_key = title_en.lower()[:30]

              entities = item.get("entities", [])
              entity = entities[0] if entities else {}
              symbol = entity.get("symbol", "").upper()

              article_obj = {
                  "title": title_en,
                  "title_ko": title_en,
                  "snippet": snippet_en[:180] + "..." if len(snippet_en) > 180 else snippet_en,
                  "snippet_ko": snippet_en[:180] + "..." if len(snippet_en) > 180 else snippet_en,
                  "symbol": symbol,
                  "sentiment_score": entity.get("sentiment_score", 0),
                  "source": item.get("source", "MarketAux"),
                  "url": item.get("url", "#"),
                  "cross_verified": False,
                  "published_at": item.get("published_at", "")
              }

              if title_key in seen_titles:
                  seen_titles[title_key]["cross_verified"] = True
              else:
                  seen_titles[title_key] = article_obj
                  processed_articles.append(article_obj)

          market_indices = {"SPY", "QQQ", "DIA", "IWM", "VT"}
          new_market_news = []
          new_portfolio_news = []

          for art in processed_articles:
              if art["symbol"] in market_indices or not art["symbol"]:
                  new_market_news.append(art)
              else:
                  new_portfolio_news.append(art)

          # 1. 기존 news.json 파일 데이터 불러오기
          old_market_news = []
          old_portfolio_news = []
          if os.path.exists("news.json"):
              try:
                  with open("news.json", "r", encoding="utf-8") as f:
                      old_data = json.load(f)
                      old_market_news = old_data.get("market_news", [])
                      old_portfolio_news = old_data.get("portfolio_news", [])
              except Exception:
                  pass

          # 2. 신규 기사와 기존 기사 병합 및 최대 100개 제한
          def merge_articles(new_list, old_list, max_limit=100):
              seen_urls = {art.get("url") for art in new_list if art.get("url")}
              combined = list(new_list)
              
              for art in old_list:
                  url = art.get("url")
                  if url and url not in seen_urls:
                      combined.append(art)
                      seen_urls.add(url)
              
              return combined[:max_limit]

          if raw_articles:
              market_news = merge_articles(new_market_news, old_market_news, max_limit=100)
              portfolio_news = merge_articles(new_portfolio_news, old_portfolio_news, max_limit=100)
          else:
              market_news = old_market_news
              portfolio_news = old_portfolio_news

          result = {
              "updated_at": datetime.now(timezone.utc).isoformat(),
              "status": "ok" if (market_news or portfolio_news) else "error",
              "market_news": market_news,
              "portfolio_news": portfolio_news
          }

          with open("news.json", "w", encoding="utf-8") as f:
              json.dump(result, f, ensure_ascii=False, indent=2)
          PY

      - name: Save news.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news.json
          git diff --cached --quiet || git commit -m "Update and accumulate market news"
          git push
