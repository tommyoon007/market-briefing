name: Update Market News

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0,6,12,18 * * *"

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch MarketAux news
        env:
          MARKETAUX_API_TOKEN: ${{ secrets.MARKETAUX_API_TOKEN }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          from datetime import datetime, timedelta, timezone
          from urllib.error import HTTPError, URLError
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen

          API_KEY = os.environ.get("MARKETAUX_API_TOKEN")

          if not API_KEY:
              print("ERROR: MARKETAUX_API_TOKEN secret is missing.")
              sys.exit(1)

          API_URL = "https://api.marketaux.com/v1/news/all"

          # 자기 포트폴리오 주요 종목
          portfolio_symbols = [
              "AAPL", "MSFT", "META", "GOOGL", "AMZN",
              "MSTR", "NVDA", "AVGO", "DIS", "MRK",
              "V", "MA", "NFLX", "TSLA", "PLTR",
              "DKNG", "MP", "AMSC", "INTC"
          ]

          def fetch_marketaux(symbols=None):
              # MarketAux 날짜 필터는 UTC 기준 초 단위 형식으로 전송
              published_after = (
                  datetime.now(timezone.utc) - timedelta(hours=48)
              ).strftime("%Y-%m-%dT%H:%M:%S")

              params = {
                  "api_token": API_KEY,
                  "language": "en",
                  "limit": "50",
                  "published_after": published_after,
                  "filter_entities": "true",
              }

              if symbols:
                  params["symbols"] = ",".join(symbols)

              url = API_URL + "?" + urlencode(params)

              print("Requesting MarketAux...")
              print("URL:", API_URL)
              print("Published after:", published_after)
              print("Symbols:", params.get("symbols", "none"))

              request = Request(
                  url,
                  headers={
                      "User-Agent": "market-briefing/1.0"
                  }
              )

              try:
                  with urlopen(request, timeout=30) as response:
                      body = response.read().decode("utf-8")
                      return json.loads(body)

              except HTTPError as error:
                  error_body = error.read().decode("utf-8", errors="replace")
                  print("MarketAux HTTP ERROR:", error.code)
                  print("MarketAux RESPONSE:", error_body)
                  raise

              except URLError as error:
                  print("MarketAux URL ERROR:", error.reason)
                  raise

          def make_item(article):
              entities = article.get("entities") or []

              symbol = ""
              for entity in entities:
                  symbol = entity.get("symbol") or ""
                  if symbol:
                      break

              return {
                  "title": article.get("title") or "",
                  "title_ko": article.get("title") or "",
                  "snippet": article.get("description") or "",
                  "snippet_ko": article.get("description") or "",
                  "symbol": symbol,
                  "sentiment_score": 0.0,
                  "source": (
                      article.get("source")
                      or article.get("source_name")
                      or ""
                  ),
                  "url": article.get("url") or "",
                  "cross_verified": False,
                  "published_at": article.get("published_at") or "",
              }

          print("MarketAux: portfolio news")

          data = fetch_marketaux(portfolio_symbols)
          articles = data.get("data") or []

          portfolio_news = [
              make_item(article)
              for article in articles
          ]

          # 시장 전체 뉴스도 별도로 가져오기
          print("MarketAux: market news")

          market_data = fetch_marketaux()
          market_articles = market_data.get("data") or []

          market_news = [
              make_item(article)
              for article in market_articles
          ]

          output = {
              "updated_at": datetime.now(timezone.utc).isoformat(),
              "status": "ok",
              "market_news": market_news,
              "portfolio_news": portfolio_news,
          }

          with open("news.json", "w", encoding="utf-8") as file:
              json.dump(output, file, ensure_ascii=False, indent=2)

          print("SUCCESS")
          print("Market news:", len(market_news))
          print("Portfolio news:", len(portfolio_news))
          print("news.json created")

          PY

      - name: Commit news.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add news.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update market news"
            git push
          fi
