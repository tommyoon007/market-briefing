name: Update Market News

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0,6,12,18 * * *"

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Collect market news
        env:
          MARKETAUX_API_TOKEN: ${{ secrets.MARKETAUX_API_TOKEN }}
        run: |
          cat > collect_news.py <<'PYTHON'
          import json
          import os
          import re
          from datetime import datetime, timezone
          from urllib.parse import urlparse

          import requests

          API_TOKEN = os.environ.get("MARKETAUX_API_TOKEN", "")
          API_URL = "https://api.marketaux.com/v1/news/all"

          PORTFOLIO_SYMBOLS = {
              "AAPL", "MSFT", "META", "GOOGL", "AMZN",
              "MSTR", "NVDA", "AVGO", "DIS", "MRK",
              "V", "MA", "NFLX", "TSLA", "PLTR",
              "DKNG", "MP", "AMSC", "INTC"
          }

          MARKET_KEYWORDS = [
              "stock", "stocks", "share", "shares", "equity",
              "nasdaq", "s&p", "dow jones", "wall street",
              "market", "investor", "investors", "trading",
              "earnings", "revenue", "profit", "guidance",
              "fed", "federal reserve", "interest rate",
              "inflation", "economy", "economic", "gdp",
              "tariff", "trade war", "recession",
              "treasury", "bond", "yield", "oil", "gold",
              "bitcoin", "crypto", "artificial intelligence",
              "ai", "semiconductor", "chip", "technology",
              "ipo", "merger", "acquisition", "dividend",
              "buyback", "downgrade", "upgrade"
          ]

          EXCLUDED_KEYWORDS = [
              "leadership development",
              "flood management",
              "master plans",
              "emi affordability",
              "celebrity",
              "horoscope",
              "sports scores",
              "recipe"
          ]

          def clean_text(value):
              if not value:
                  return ""
              return re.sub(r"\s+", " ", str(value)).strip()

          def get_text(article):
              title = clean_text(article.get("title"))
              description = clean_text(
                  article.get("description")
                  or article.get("snippet")
                  or article.get("content")
              )
              return f"{title} {description}".lower()

          def get_symbol(article):
              symbols = article.get("symbols") or []

              if isinstance(symbols, list):
                  for symbol in symbols:
                      symbol = str(symbol).upper().strip()
                      if symbol in PORTFOLIO_SYMBOLS:
                          return symbol

              text = get_text(article)

              for symbol in sorted(PORTFOLIO_SYMBOLS, key=len, reverse=True):
                  pattern = rf"(?<![A-Z]){re.escape(symbol)}(?![A-Z])"
                  if re.search(pattern, text.upper()):
                      return symbol

              return ""

          def is_excluded(article):
              text = get_text(article)
              return any(keyword in text for keyword in EXCLUDED_KEYWORDS)

          def is_market_related(article):
              if is_excluded(article):
                  return False

              text = get_text(article)

              if get_symbol(article):
                  return True

              return any(keyword in text for keyword in MARKET_KEYWORDS)

          def article_key(article):
              url = clean_text(article.get("url"))
              title = clean_text(article.get("title")).lower()

              if url:
                  return ("url", url)

              return ("title", title)

          def unique_articles(articles):
              result = []
              seen = set()

              for article in articles:
                  key = article_key(article)

                  if key in seen:
                      continue

                  seen.add(key)
                  result.append(article)

              return result

          def make_article(article):
              title = clean_text(article.get("title"))
              snippet = clean_text(
                  article.get("description")
                  or article.get("snippet")
                  or article.get("content")
              )

              source = article.get("source")
              if isinstance(source, dict):
                  source = source.get("domain") or source.get("name")

              source = clean_text(source)

              url = clean_text(article.get("url"))
              published_at = article.get("published_at") or ""

              symbol = get_symbol(article)

              return {
                  "title": title,
                  "title_ko": title,
                  "snippet": snippet,
                  "snippet_ko": snippet,
                  "symbol": symbol,
                  "sentiment_score": 0.0,
                  "source": source,
                  "url": url,
                  "cross_verified": False,
                  "published_at": published_at
              }

          if not API_TOKEN:
              raise RuntimeError("MARKETAUX_API_TOKEN is missing")

          params = {
              "api_token": API_TOKEN,
              "language": "en",
              "limit": 100,
              "filter_entities": "true"
          }

          response = requests.get(
              API_URL,
              params=params,
              timeout=30
          )

          response.raise_for_status()

          payload = response.json()
          articles = payload.get("data") or []

          market_articles = [
              article for article in articles
              if is_market_related(article)
          ]

          portfolio_articles = [
              article for article in market_articles
              if get_symbol(article)
          ]

          market_articles = unique_articles(market_articles)
          portfolio_articles = unique_articles(portfolio_articles)

          market_articles = [
              make_article(article)
              for article in market_articles[:20]
          ]

          portfolio_articles = [
              make_article(article)
              for article in portfolio_articles[:30]
          ]

          output = {
              "updated_at": datetime.now(timezone.utc).isoformat(),
              "status": "ok",
              "market_news": market_articles,
              "portfolio_news": portfolio_articles
          }

          with open("news.json", "w", encoding="utf-8") as file:
              json.dump(
                  output,
                  file,
                  ensure_ascii=False,
                  indent=2
              )

          print(f"Market news: {len(market_articles)}")
          print(f"Portfolio news: {len(portfolio_articles)}")
          print("news.json created successfully")
          PYTHON

          python collect_news.py

      - name: Commit and push news.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add news.json

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update market news"
            git push
          fi
